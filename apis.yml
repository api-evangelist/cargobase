aid: cargobase
name: Cargobase
description: >-
  Cargobase is a cloud-based Transportation Management System (TMS) for
  enterprise shippers that automates spot-buy and contract freight procurement
  across air, ocean, road, and courier modes. Shippers request quotes, compare
  carrier and forwarder rates apples-to-apples, award and execute shipments,
  track them in real time, audit freight invoices, and report on carbon
  emissions and logistics-provider performance from a single platform. Founded
  in 2013, Cargobase serves automotive, aviation, semiconductor, machinery,
  energy, and oil-and-gas shippers worldwide, is ISO/IEC 27001 certified and SOC
  2 compliant, and is backed by 500 Global.
